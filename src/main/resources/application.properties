spring.application.name=Booking-System

# ----------------------------------------
# MySQL Database Configuration
# ----------------------------------------
# createDatabaseIfNotExist=true automatically creates the DB if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/salon_booking_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Change these to match your MySQL username and password
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# JPA / Hibernate Configuration
# ----------------------------------------
# update: automatically creates/updates tables based on entity classes
spring.jpa.hibernate.ddl-auto=update
# Print SQL statements to the console for debugging
spring.jpa.show-sql=true
# Format SQL for better readability
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------
# Server Configuration
# ----------------------------------------
server.port=8080
