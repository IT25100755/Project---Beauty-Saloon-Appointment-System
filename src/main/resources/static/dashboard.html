<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard | Body Glow</title>
    <meta name="description" content="Manage your Body Glow appointments and account settings.">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="min-h-screen text-white bg-gradient-to-r from-[#1A1A1A] to-[#2F4F4F]">

    <!-- ── Header ─────────────────────────────────────────────── -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-8 h-8 text-[#C9A961]"></i>
                    <a href="index.html">
                        <span class="text-3xl font-serif text-[#C9A961] text-outline text-luxury-shadow">Body Glow</span>
                    </a>
                </div>
                <b><nav class="hidden md:flex gap-8 text-shadow-glow text-[#C9A961] text-lg font-medium">
                    <a href="index.html" class="hover:scale-110 transition-all duration-300 transform inline-block">Home</a>
                    <a href="services.html" class="hover:scale-110 transition-all duration-300 transform inline-block">Services</a>
                    <a href="offers.html" class="hover:scale-110 transition-all duration-300 transform inline-block">Offers</a>
                    <a href="admin.html" class="hover:scale-110 transition-all duration-300 transform inline-block">⚙ Admin</a>
                </nav></b>
                <div id="auth-section" class="flex items-center gap-3"></div>
            </div>
        </div>
    </header>

    <main class="pt-24 pb-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- ── Welcome Banner ─────────────────────────────────── -->
        <div class="mb-10 animate-fadeInUp">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <p class="text-[#C9A961] text-sm font-semibold uppercase tracking-widest mb-1">Welcome back</p>
                    <h1 class="text-4xl font-serif text-white" id="dashboard-greeting">My Dashboard</h1>
                    <p class="text-gray-400 mt-1 text-sm" id="dashboard-email">—</p>
                </div>
                <a href="bookingform.html"
                   class="inline-flex items-center gap-2 bg-[#C9A961] hover:bg-[#B8933F] text-[#1A1A1A] font-bold px-6 py-3 rounded-lg transition-all hover:scale-105 hover:shadow-lg hover:shadow-[#C9A961]/20 self-start sm:self-center">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    Book New Appointment
                </a>
            </div>
        </div>

        <!-- ── Stats Cards ────────────────────────────────────── -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10 animate-fadeInUp delay-100">
            <div class="glass-grid rounded-xl p-5 border border-white/10 text-center">
                <div class="text-3xl font-serif text-[#C9A961] mb-1" id="stat-total">—</div>
                <div class="text-gray-400 text-xs uppercase tracking-wider">Total Bookings</div>
            </div>
            <div class="glass-grid rounded-xl p-5 border border-white/10 text-center">
                <div class="text-3xl font-serif text-[#C9A961] mb-1" id="stat-upcoming">—</div>
                <div class="text-gray-400 text-xs uppercase tracking-wider">Upcoming</div>
            </div>
            <div class="glass-grid rounded-xl p-5 border border-white/10 text-center">
                <div class="text-3xl font-serif text-[#81C784] mb-1" id="stat-completed">—</div>
                <div class="text-gray-400 text-xs uppercase tracking-wider">Completed</div>
            </div>
            <div class="glass-grid rounded-xl p-5 border border-white/10 text-center">
                <div class="text-3xl font-serif text-[#EF9A9A] mb-1" id="stat-cancelled">—</div>
                <div class="text-gray-400 text-xs uppercase tracking-wider">Cancelled</div>
            </div>
        </div>

        <!-- ── Appointments ───────────────────────────────────── -->
        <div class="animate-fadeInUp delay-200">

            <!-- Filter tabs -->
            <div class="flex gap-2 mb-6 flex-wrap">
                <button class="tab-btn active" id="filter-all"       onclick="filterBookings('all')">All</button>
                <button class="tab-btn"         id="filter-Booked"    onclick="filterBookings('Booked')">Upcoming</button>
                <button class="tab-btn"         id="filter-Completed" onclick="filterBookings('Completed')">Completed</button>
                <button class="tab-btn"         id="filter-Cancelled" onclick="filterBookings('Cancelled')">Cancelled</button>
            </div>

            <div id="appointments-container">
                <!-- Skeletons -->
                <div class="space-y-4">
                    <div class="skeleton h-24 rounded-xl"></div>
                    <div class="skeleton h-24 rounded-xl"></div>
                    <div class="skeleton h-24 rounded-xl"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- ── Cancel Confirmation Modal ─────────────────────────── -->
    <div id="cancel-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeCancelModal()"></div>
        <div class="relative glass-grid rounded-2xl p-8 max-w-md w-full mx-4 border border-white/10 shadow-2xl">
            <h3 class="text-xl font-serif text-white mb-2">Cancel Appointment?</h3>
            <p class="text-gray-400 text-sm mb-6">Are you sure you want to cancel this appointment? This action cannot be undone.</p>
            <div class="flex gap-3">
                <button onclick="closeCancelModal()"
                        class="flex-1 glass-button border border-white/20 text-gray-300 hover:text-white py-2 rounded-lg font-semibold transition-all">
                    Keep It
                </button>
                <button onclick="confirmCancel()" id="cancel-confirm-btn"
                        class="flex-1 bg-red-500/80 hover:bg-red-500 text-white py-2 rounded-lg font-semibold transition-all">
                    Yes, Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- ── Footer ─────────────────────────────────────────────── -->
    <footer class="bg-[#1A1A1A] glass-header text-white py-12 border-t border-[#C9A961]/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-gray-500">&copy; 2026 Body Glow. All rights reserved.</p>
        </div>
    </footer>

    <script src="script/script.js"></script>
    <script>
        let allAppointments  = [];
        let currentFilter    = 'all';
        let cancelTargetId   = null;

        // ── Init ─────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', async () => {
            const user = requireAuth();
            if (!user) return;

            document.getElementById('dashboard-greeting').textContent = `Hello, ${user.name.split(' ')[0]} ✨`;
            document.getElementById('dashboard-email').textContent    = user.email;

            await loadAppointments(user.id);
        });

        // ── Load Appointments ────────────────────────────────────
        async function loadAppointments(userId) {
            try {
                allAppointments = await apiGet(`/appointments/user/${userId}`);
                updateStats();
                renderAppointments('all');
            } catch (err) {
                document.getElementById('appointments-container').innerHTML = `
                    <div class="text-center py-16 text-gray-500">
                        <i data-lucide="wifi-off" class="w-12 h-12 mx-auto mb-4 opacity-40"></i>
                        <p>Could not load appointments. Is the server running?</p>
                    </div>`;
                lucide.createIcons();
            }
        }

        // ── Update Stat Cards ────────────────────────────────────
        function updateStats() {
            document.getElementById('stat-total').textContent     = allAppointments.length;
            document.getElementById('stat-upcoming').textContent  = allAppointments.filter(a => a.status === 'Booked').length;
            document.getElementById('stat-completed').textContent = allAppointments.filter(a => a.status === 'Completed').length;
            document.getElementById('stat-cancelled').textContent = allAppointments.filter(a => a.status === 'Cancelled').length;
        }

        // ── Filter ───────────────────────────────────────────────
        function filterBookings(filter) {
            currentFilter = filter;
            ['all','Booked','Completed','Cancelled'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (btn) btn.classList.toggle('active', f === filter);
            });
            renderAppointments(filter);
        }

        // ── Render Appointments ──────────────────────────────────
        function renderAppointments(filter) {
            const list = filter === 'all'
                ? allAppointments
                : allAppointments.filter(a => a.status === filter);

            const container = document.getElementById('appointments-container');

            if (!list.length) {
                const messages = {
                    all:       ['No appointments yet', 'Book your first luxury experience!'],
                    Booked:    ['No upcoming appointments', 'Ready for your next visit?'],
                    Completed: ['No completed appointments', 'Your future ones will appear here.'],
                    Cancelled: ['No cancelled appointments', 'Great job keeping your schedule!']
                };
                const [title, sub] = messages[filter] || messages.all;
                container.innerHTML = `
                    <div class="text-center py-16">
                        <i data-lucide="calendar-x" class="w-14 h-14 text-[#C9A961]/30 mx-auto mb-4"></i>
                        <h3 class="text-white font-semibold text-lg mb-2">${title}</h3>
                        <p class="text-gray-500 text-sm mb-6">${sub}</p>
                        <a href="bookingform.html"
                           class="inline-block bg-[#C9A961] hover:bg-[#B8933F] text-[#1A1A1A] font-bold px-6 py-3 rounded-lg transition-all hover:scale-105">
                            Book Now
                        </a>
                    </div>`;
                lucide.createIcons();
                return;
            }

            // Sort: newest first
            const sorted = [...list].sort((a, b) =>
                new Date(b.appointmentTime) - new Date(a.appointmentTime));

            container.innerHTML = `<div class="space-y-4">${sorted.map(appt => renderCard(appt)).join('')}</div>`;
            lucide.createIcons();
        }

        function renderCard(appt) {
            const isPast     = new Date(appt.appointmentTime) < new Date();
            const isBooked   = appt.status === 'Booked';
            const canCancel  = isBooked && !isPast;

            return `
            <div class="glass-grid rounded-xl border border-white/10 hover:border-[#C9A961]/30 transition-all duration-300 overflow-hidden"
                 id="appt-card-${appt.id}">
                <div class="flex flex-col sm:flex-row sm:items-center gap-4 p-5">
                    <!-- Date block -->
                    <div class="shrink-0 w-16 h-16 rounded-xl bg-[#C9A961]/10 border border-[#C9A961]/25 flex flex-col items-center justify-center text-center">
                        <div class="text-[#C9A961] text-lg font-bold leading-none">
                            ${new Date(appt.appointmentTime).getDate()}
                        </div>
                        <div class="text-[#C9A961] text-xs font-semibold uppercase">
                            ${new Date(appt.appointmentTime).toLocaleDateString('en-US',{month:'short'})}
                        </div>
                        <div class="text-gray-500 text-xs">
                            ${new Date(appt.appointmentTime).getFullYear()}
                        </div>
                    </div>

                    <!-- Details -->
                    <div class="flex-1 min-w-0">
                        <div class="flex flex-wrap items-center gap-2 mb-1">
                            <h3 class="text-white font-semibold text-base">
                                ${escapeHtml(appt.salonService?.name || '—')}
                            </h3>
                            ${statusBadge(appt.status)}
                        </div>
                        <div class="flex flex-wrap gap-4 text-gray-400 text-sm mt-1">
                            <span class="flex items-center gap-1">
                                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                                ${new Date(appt.appointmentTime).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}
                            </span>
                            <span class="flex items-center gap-1">
                                <i data-lucide="user" class="w-3.5 h-3.5"></i>
                                ${escapeHtml(appt.staff?.name || '—')}
                                <span class="text-gray-600">· ${escapeHtml(appt.staff?.role || '')}</span>
                            </span>
                            <span class="flex items-center gap-1">
                                <i data-lucide="timer" class="w-3.5 h-3.5"></i>
                                ${appt.salonService?.durationMinutes || '—'} min
                            </span>
                        </div>
                    </div>

                    <!-- Price & Actions -->
                    <div class="sm:text-right shrink-0">
                        <div class="text-[#C9A961] font-bold text-lg mb-2">
                            $${appt.salonService?.price?.toFixed(2) || '—'}
                        </div>
                        ${canCancel ? `
                        <button onclick="openCancelModal(${appt.id})"
                                class="text-xs text-red-400 hover:text-red-300 border border-red-400/30 hover:border-red-400/60 px-3 py-1.5 rounded-lg transition-all">
                            Cancel
                        </button>` : ''}
                    </div>
                </div>
            </div>`;
        }

        // ── Cancel Modal ─────────────────────────────────────────
        function openCancelModal(id) {
            cancelTargetId = id;
            document.getElementById('cancel-modal').classList.remove('hidden');
        }
        function closeCancelModal() {
            cancelTargetId = null;
            document.getElementById('cancel-modal').classList.add('hidden');
        }
        async function confirmCancel() {
            if (!cancelTargetId) return;
            const btn = document.getElementById('cancel-confirm-btn');
            btn.textContent = 'Cancelling…';
            btn.disabled    = true;

            try {
                const result = await apiPut(`/appointments/${cancelTargetId}/cancel`);
                if (result.ok) {
                    // Update locally
                    const appt = allAppointments.find(a => a.id === cancelTargetId);
                    if (appt) appt.status = 'Cancelled';
                    updateStats();
                    renderAppointments(currentFilter);
                    showToast('Appointment cancelled successfully.', 'success');
                } else {
                    showToast('Failed to cancel. Please try again.', 'error');
                }
            } catch {
                showToast('Network error. Please try again.', 'error');
            } finally {
                closeCancelModal();
                btn.textContent = 'Yes, Cancel';
                btn.disabled    = false;
            }
        }
    </script>
</body>
</html>
